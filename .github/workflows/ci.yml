name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only: this workflow validates, it never deploys. Keeping it separate
# from pages.yml means fork PRs can run it (they cannot hold pages: write).
permissions:
  contents: read

# Superseded runs on the same ref are pointless once a newer commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Clean build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler: latest # the lockfile is generated by Bundler 4
          bundler-cache: true
          working-directory: docs

      # _config_ci.yml makes Sass deprecations fatal, so a reintroduced
      # @import fails here rather than warning for months in the deploy log.
      - name: Build with Jekyll
        env:
          JEKYLL_ENV: production
        run: |
          set -o pipefail
          bundle exec jekyll build \
            --config _config.yml,_config_ci.yml \
            --destination ./_site 2>&1 | tee "$RUNNER_TEMP/build.log"

      # fatal_deprecations only covers Sass. This catches everything else
      # Jekyll warns about -- Liquid errors, missing includes, plugin notices.
      - name: Assert build emitted no warnings
        run: |
          if grep -Ein 'deprecat|^[[:space:]]*Warning|Liquid Warning' "$RUNNER_TEMP/build.log"; then
            echo "::error::Build emitted warnings; see the matches above."
            exit 1
          fi
          echo "Build log is clean."

      # A warning-free build can still yield a broken stylesheet, so assert
      # the compiled CSS is actually there and plausibly complete.
      - name: Assert stylesheet compiled
        run: |
          css=_site/assets/css/main.css
          if [ ! -s "$css" ]; then
            echo "::error::$css is missing or empty."
            exit 1
          fi
          size=$(wc -c < "$css")
          if [ "$size" -lt 1000 ]; then
            echo "::error::$css is only $size bytes; expected >1000."
            exit 1
          fi
          echo "Stylesheet is $size bytes."

      - name: Validate HTML
        # External links are left out on purpose: third-party outages would
        # fail PRs for reasons unrelated to the change under review.
        run: |
          bundle exec htmlproofer ./_site \
            --disable-external \
            --allow-hash-href
