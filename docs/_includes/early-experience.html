{% assign early_experience = site.data.data.early_experience %}
{% if early_experience %}
<section class="early-experience experience">
    <h2 class="title">Early Career</h2>
    {% for exp in early_experience %}
        <div class="experience-item">
            <div class="role">
                {{exp.role}}
            </div>
            <div class="company">
                {{exp.company}}
                <span class="time">{{exp.time}}</span>
            </div>
            <div class="details">{{exp.details | markdownify}}</div>
            <p class="technologies">Technologies Used: {{exp.technologies_used}}</p>
        </div>
    {% endfor %}
</section>
{% endif %}
