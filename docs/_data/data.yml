# Profile
profile: |
  Enthusiastic, self-motivated computer engineer with years of experience taking projects from zero to one and
  beyond. Evan got his start building cyber-physical systems, writing sensor and wearable software in a university
  research lab and teaching embedded design to undergraduates. He spent the years after that in cloud services and
  desktop applications, and has since come back to firmware. As an empathetic person, Evan takes great joy in helping
  his fellow developers succeed through thoughtful tooling and quality code. Evan is passionate about building
  lasting and sustainable engineering cultures, as well as nurturing and growing the next generation of talent
  through mentorship and recruiting efforts.

  Evan is currently a founding team member at Vale Matcha, where he leads software and firmware development for a
  new line of mix-on-demand matcha vending machines. He writes the embedded Rust that runs on the machines, designs
  the distributed control system alongside mechanical and electrical engineers, and builds the cloud platform that
  monitors the fleet and ships firmware updates to it.

profile_short: |
