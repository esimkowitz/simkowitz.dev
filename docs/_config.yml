title: Evan Simkowitz
description: >- # this means to ignore newlines until "baseurl:"
  Hello World!
domain: "www.simkowitz.dev"
url: "https://www.simkowitz.dev" # the base hostname & protocol for your site, e.g. http://example.com
github_username:  esimkowitz
linkedin_username: esimkowitz
theme_skin: blue

sass:
  sass_dir: _sass
  style: compressed
  sourcemap: never # Jekyll 4 would otherwise emit an unreferenced main.css.map

plugins:
    - jekyll-minifier

jekyll-minifier:
  # robots.txt has front matter, so it is a Jekyll::Page and gets routed through the
  # HTML compressor, which collapses the newline between the directives.
  exclude:
    - 'robots.txt'

exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
